spring.application.name=auth

server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferrefix_auth}
spring.datasource.username=${DB_USERNAME:ferrefix_auth}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.jackson.deserialization.fail-on-unknown-properties=true

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ferrefix-auth
app.jwt.access-token-ttl=15m
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed.enabled=${SEED_USERS_ENABLED:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@ferrefix.test}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.cliente1-email=${SEED_CLIENTE1_EMAIL:cliente1@ferrefix.test}
app.seed.cliente1-password=${SEED_CLIENTE1_PASSWORD:}
app.seed.cliente2-email=${SEED_CLIENTE2_EMAIL:cliente2@ferrefix.test}
app.seed.cliente2-password=${SEED_CLIENTE2_PASSWORD:}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
