spring.application.name=catalogo
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/ferrefix_catalogo}
spring.datasource.username=${DB_USERNAME:ferrefix_catalogo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
app.auth.url=${MS_AUTH_URI:http://localhost:8081}
app.media.directory=${MEDIA_DIRECTORY:../media}
spring.cloud.openfeign.client.config.auth.connectTimeout=3000
spring.cloud.openfeign.client.config.auth.readTimeout=5000
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never
