spring.application.name=ordenes
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/ferrefix_ordenes}
spring.datasource.username=${DB_USERNAME:ferrefix_ordenes}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
app.auth.url=${MS_AUTH_URI:http://localhost:8081}
app.catalogo.url=${MS_CATALOGO_URI:http://localhost:8082}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# --- Webpay Plus (Transbank) ---
app.webpay.url=${WEBPAY_URL:https://webpay3gint.transbank.cl}
app.webpay.commerce-code=${WEBPAY_COMMERCE_CODE:597055555532}
app.webpay.api-key=${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
# URL a la que Webpay devuelve el NAVEGADOR del usuario (pasa por el gateway)
app.webpay.return-url=${WEBPAY_RETURN_URL:http://localhost:8080/api/v1/ordenes/pagos/webpay/retorno}
# Página del frontend donde el backend redirige al terminar
app.webpay.frontend-url=${WEBPAY_FRONTEND_URL:http://localhost:5173/pago/resultado}