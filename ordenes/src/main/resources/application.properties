spring.application.name=ordenes
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/ferrefix_ordenes}
spring.datasource.username=${DB_USERNAME:ferrefix_ordenes}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
app.auth.url=${MS_AUTH_URI:http://localhost:8081}
app.catalogo.url=${MS_CATALOGO_URI:http://localhost:8082}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
